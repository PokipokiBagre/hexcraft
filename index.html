<!DOCTYPE html>
<html lang="es">
<head>
    <script src="hex-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEX ROL</title>
    <link rel="icon" type="image/png" sizes="32x32" href="img/icon.png">
    <link rel="shortcut icon" href="img/icon.png">
    <link rel="apple-touch-icon" href="img/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ── NAV ───────────────────────────────────────────────────── -->
<nav class="site-nav">
    <div class="nav-brand">
        <span class="nav-logo">⬡</span>
        <span class="nav-title" id="nav-title">HEX ROL</span>
    </div>
    <div class="nav-right">
        <!-- hex-guard.js inyecta el botón "cambiar campaña" aquí -->
        <div id="hex-session-badge"></div>
    </div>
</nav>

<!-- ── HERO ──────────────────────────────────────────────────── -->
<div class="hero" id="hero">
    <div class="hero-inner">
        <div class="hero-sub" id="hero-sub">CAMPAÑA DE ROL MÁGICA</div>
        <div class="hero-lore" id="hero-lore">Cargando campaña…</div>
    </div>
</div>

<!-- ── MÓDULOS ───────────────────────────────────────────────── -->
<div class="modulos-grid" id="modulos-grid">
    <!-- Renderizado por JS -->
</div>

<!-- ── DASHBOARD ─────────────────────────────────────────────── -->
<div class="dash-section">

    <!-- Party activa -->
    <div class="section-title" style="margin-bottom:16px;">PARTY ACTIVA</div>
    <div class="party-scroll" id="party-grid">
        <!-- Renderizado por JS -->
    </div>

    <!-- Resto del dashboard -->
    <div id="dash-extra"></div>
</div>

<!-- ── HILOS ACTIVOS ─────────────────────────────────────────── -->
<div class="hilos-section" id="hilos-section" style="display:none;">
    <div class="section-title">HILOS ACTIVOS</div>
    <div class="hilos-row" id="hilos-row"></div>
</div>

<script type="module">
import { hexAuth, currentConfig } from './hex-auth.js';
import { hexConfigs }              from './hex/config.js';
import { createClient }            from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// Exponer para hex-guard.js
window.hexConfigs = hexConfigs;

const cfg = currentConfig;
const sb  = createClient(cfg.dbUrl, cfg.dbAnonKey);

// ── Auth ──────────────────────────────────────────────────────
await hexAuth.init();
const badge = document.getElementById('hex-session-badge');
if (badge) badge.innerHTML = hexAuth.renderStatusBadge();

// ── UI de campaña ─────────────────────────────────────────────
document.getElementById('nav-title').textContent  = cfg.ui?.titulo    || 'HEX ROL';
document.getElementById('hero-sub').textContent   = cfg.ui?.subtitulo || 'CAMPAÑA DE ROL';
document.getElementById('hero-lore').textContent  = cfg.ui?.lore      || '';
document.title = (cfg.ui?.titulo || 'HEX ROL');

// Hero background
if (cfg.storageUrl) {
    const hero = document.getElementById('hero');
    if (hero) {
        hero.style.backgroundImage = `linear-gradient(to top, rgba(7,6,14,0.9) 0%, rgba(7,6,14,0.4) 100%), url('${cfg.storageUrl}/banner.jpg')`;
        hero.style.backgroundSize   = 'cover';
        hero.style.backgroundPosition = 'center';
    }
}

// ── Módulos ───────────────────────────────────────────────────
const MODULOS = [
    { href:'personajes/index.html', img:'personajes',    nombre:'Personajes',         desc:'Stats · afinidades · inventario' },
    { href:'hechizos/index.html',   img:'hechizos',      nombre:'Mapa de Hechizos',   desc:'Árbol de aprendizaje · grimorio' },
    { href:'misiones/index.html',   img:'misiones',      nombre:'Misiones',           desc:'Tablón de quests activas' },
    { href:'hexcast/index.html',    img:'hexcast',       nombre:'HexCast',            desc:'Calculadora de conjuros' },
    { href:'panel/index.html',      img:'panel',         nombre:'Panel de Control',   desc:'Acceso máster', op: true },
];

const grid = document.getElementById('modulos-grid');
if (grid) {
    grid.innerHTML = MODULOS.map(m => `
        <a href="${m.href}" class="modulo ${m.op ? 'modulo-op' : ''}">
            <div class="modulo-img-wrap">
                <img class="modulo-img" src="${cfg.storageUrl}/${m.img}.jpg"
                     onerror="this.style.display='none'" alt="">
            </div>
            <div class="modulo-body">
                <div class="modulo-nombre">${m.nombre}</div>
                <div class="modulo-desc">${m.desc}</div>
            </div>
        </a>
    `).join('');
}

// ── Party activa ──────────────────────────────────────────────
async function cargarParty() {
    const { data: pjs } = await sb
        .from('personajes')
        .select('nombre,is_player,is_active,hex,vex_actual,vex_max,vida_roja_actual,guarda_actual,guarda_max,push_vex_actual,push_vex_limit,push_vex_ts,push_guarda_actual,push_guarda_limit,push_guarda_ts,af_fisica,af_energetica,af_espiritual,af_mando,af_psiquica,af_oscura,af_oscura,icono_override')
        .eq('is_player', true)
        .eq('is_active', true)
        .order('nombre');

    const { data: formData } = await sb
        .from('config_formulas')
        .select('clave,expresion');

    // Fórmulas mínimas para vida_roja_max y vex_max
    const fMap = {};
    (formData || []).forEach(f => { fMap[f.clave] = f.expresion; });
    const fVidaRoja = fMap['vida_roja_max'] || 'Math.floor(FisB / 2) + 10';
    const fVexMax   = fMap['vex_max']       || 'Math.round(OscB * 75 / 50) * 50';
    const fGuardaMax= fMap['guarda_max']    || 'Math.floor(EspB / 3)';

    // Push umbrales (simplificado: usamos defaults si no los cargamos)
    const { data: pushUData } = await sb
        .from('config_push_umbrales')
        .select('*')
        .order('orden');
    const { data: pushFData } = await sb
        .from('config_push')
        .select('clave,expresion');

    const pushFMap = {};
    (pushFData || []).forEach(f => { pushFMap[f.clave] = f.expresion; });
    const fPushVex    = pushFMap['valor_push_vex']    || 'Math.round((OscB * 75 / 50) * 50 * 0.5)';
    const fPushGuarda = pushFMap['valor_push_guarda'] || 'Math.max(1, Math.round(EspB / 3))';
    const cdVex    = parseFloat(pushFMap['cooldown_vex'])    || 60;
    const cdGuarda = parseFloat(pushFMap['cooldown_guarda']) || 30;

    const pushU = { vex: [], guarda: [] };
    (pushUData || []).forEach(u => {
        if (u.recurso === 'vex')    pushU.vex.push(u);
        if (u.recurso === 'guarda') pushU.guarda.push(u);
    });
    // Defaults si DB está vacía
    if (!pushU.vex.length) pushU.vex = [
        { condicion:'pct_vida_roja >= 50', pushes:1 },
        { condicion:'pct_vida_roja >= 75', pushes:1 },
        { condicion:'vida_azul > 20',      pushes:1 },
        { condicion:'vida_azul > 40',      pushes:1 },
        { condicion:'vida_azul > 80',      pushes:1 },
    ];
    if (!pushU.guarda.length) pushU.guarda = pushU.vex.map(u => ({...u}));

    function evalEx(expr, ctx) {
        try {
            const {Fis,Ene,Esp,Man,Psi,Osc,FisB,EneB,EspB,ManB,PsiB,OscB} = ctx;
            return Math.max(0, Math.round(new Function('Fis','Ene','Esp','Man','Psi','Osc','FisB','EneB','EspB','ManB','PsiB','OscB',
                `return Math.max(0, ${expr});`)(Fis,Ene,Esp,Man,Psi,Osc,FisB,EneB,EspB,ManB,PsiB,OscB)));
        } catch { return 0; }
    }

    function evalCond(cond, pct_vida_roja, vida_azul) {
        try { return new Function('pct_vida_roja','vida_azul', `return !!(${cond});`)(pct_vida_roja, vida_azul); }
        catch { return false; }
    }

    function calcPushDisp(pj, ctx, vidaRojaMax, vidaAzulMax, recurso) {
        const pct = vidaRojaMax > 0 ? Math.round((pj.vida_roja_actual||0) / vidaRojaMax * 100) : 0;
        const va  = vidaAzulMax;
        let total = (pushU[recurso] || []).reduce((s, u) => s + (evalCond(u.condicion, pct, va) ? u.pushes : 0), 0);
        total += recurso === 'vex' ? (pj.push_vex_limit || 0) : (pj.push_guarda_limit || 0);
        return total;
    }

    function calcCd(pj, recurso) {
        const ts = recurso === 'vex' ? pj.push_vex_ts : pj.push_guarda_ts;
        const cd = recurso === 'vex' ? cdVex : cdGuarda;
        if (!ts) return { disponible: true, restaSeg: 0 };
        const pasado = (Date.now() - new Date(ts).getTime()) / 1000;
        const total  = cd * 60;
        if (pasado >= total) return { disponible: true, restaSeg: 0 };
        return { disponible: false, restaSeg: Math.ceil(total - pasado) };
    }

    const partyGrid = document.getElementById('party-grid');
    if (!partyGrid || !pjs?.length) {
        if (partyGrid) partyGrid.innerHTML = '<div style="color:var(--dim);font-size:0.85em;padding:20px 0;">Sin jugadores activos.</div>';
        return;
    }

    partyGrid.innerHTML = pjs.map(pj => {
        const OscB = pj.af_oscura     || 0;
        const FisB = pj.af_fisica     || 0;
        const EneB = pj.af_energetica || 0;
        const EspB = pj.af_espiritual || 0;
        const ManB = pj.af_mando      || 0;
        const PsiB = pj.af_psiquica   || 0;

        const ctx = { Fis:FisB,Ene:EneB,Esp:EspB,Man:ManB,Psi:PsiB,Osc:OscB,
                      FisB,EneB,EspB,ManB,PsiB,OscB };

        const vidaRojaMax = evalEx(fVidaRoja, ctx);
        const vexMax      = evalEx(fVexMax,   ctx);
        const guardaMax   = evalEx(fGuardaMax, ctx);
        const vidaAzulMax = evalEx(fMap['vida_azul_max'] || 'Math.floor((EneB+EspB+ManB+PsiB)/4)', ctx);

        const vidaActual  = pj.vida_roja_actual || 0;
        const vexActual   = pj.vex_actual       || 0;

        const pctVida  = vidaRojaMax > 0 ? Math.min(100, Math.round(vidaActual / vidaRojaMax * 100)) : 0;
        const pctVex   = vexMax > 0      ? Math.min(100, Math.round(vexActual  / vexMax      * 100)) : 0;
        const pctGuarda= guardaMax > 0   ? Math.min(100, Math.round((pj.guarda_actual||0) / guardaMax * 100)) : 0;

        const pushVexDisp    = calcPushDisp(pj, ctx, vidaRojaMax, vidaAzulMax, 'vex');
        const pushGuardaDisp = calcPushDisp(pj, ctx, vidaRojaMax, vidaAzulMax, 'guarda');
        const pushVexUs      = pj.push_vex_actual    || 0;
        const pushGuardaUs   = pj.push_guarda_actual || 0;
        const cdVexInfo      = calcCd(pj, 'vex');
        const cdGuardaInfo   = calcCd(pj, 'guarda');

        const icono = pj.icono_override || pj.nombre;
        const imgUrl = `${cfg.storageUrl}/${encodeURIComponent(icono)}.jpg`;
        // Link directo a la página de personajes con el panel abierto
        const link = `personajes/index.html?pj=${encodeURIComponent(pj.nombre)}`;

        return `
        <a href="${link}" class="party-card-link" style="text-decoration:none;">
        <div class="party-card">
            <div class="party-card-img-wrap">
                <img class="party-card-img" src="${imgUrl}" onerror="this.style.display='none'" alt="${pj.nombre}">
                <div class="party-card-overlay"></div>
                <div class="party-card-name">${pj.nombre}</div>
            </div>
            <div class="party-card-body">
                <div class="party-card-hex">${(pj.hex||0).toLocaleString()} <span style="font-family:var(--font-display);font-size:0.7em;color:var(--dim);">HEX</span></div>

                <!-- Vida -->
                <div class="party-stat-row">
                    <span class="party-stat-label">VIDA</span>
                    <div class="party-bar-track">
                        <div class="party-bar-fill party-bar-vida" style="width:${pctVida}%"></div>
                    </div>
                    <span class="party-stat-val">${vidaActual} / ${vidaRojaMax}</span>
                </div>

                <!-- VEX -->
                ${vexMax > 0 ? `<div class="party-stat-row">
                    <span class="party-stat-label">VEX</span>
                    <div class="party-bar-track">
                        <div class="party-bar-fill party-bar-vex" style="width:${pctVex}%"></div>
                    </div>
                    <span class="party-stat-val">${vexActual} / ${vexMax}</span>
                </div>` : ''}

                <!-- Guarda -->
                ${guardaMax > 0 ? `<div class="party-stat-row">
                    <span class="party-stat-label">GUARDA</span>
                    <div class="party-bar-track">
                        <div class="party-bar-fill party-bar-guarda" style="width:${pctGuarda}%"></div>
                    </div>
                    <span class="party-stat-val">${pj.guarda_actual||0} / ${guardaMax}</span>
                </div>` : ''}

                <!-- Pushes disponibles -->
                <div class="party-pushes">
                    ${vexMax > 0 ? `<span class="party-push-tag party-push-vex ${cdVexInfo.disponible ? '' : 'push-cd-tag'}" title="Push VEX">
                        ⚡ ${pushVexUs}/${pushVexDisp}
                        ${!cdVexInfo.disponible ? `<span class="push-cd-mini">⏳${Math.ceil(cdVexInfo.restaSeg/60)}m</span>` : ''}
                    </span>` : ''}
                    ${guardaMax > 0 ? `<span class="party-push-tag party-push-guarda ${cdGuardaInfo.disponible ? '' : 'push-cd-tag'}" title="Push Guarda">
                        🛡 ${pushGuardaUs}/${pushGuardaDisp}
                        ${!cdGuardaInfo.disponible ? `<span class="push-cd-mini">⏳${Math.ceil(cdGuardaInfo.restaSeg/60)}m</span>` : ''}
                    </span>` : ''}
                </div>
            </div>
        </div>
        </a>`;
    }).join('');
}

cargarParty();

// Timer para actualizar cooldowns en vivo en el índice
setInterval(() => {
    document.querySelectorAll('[data-cd-end]').forEach(el => {
        const end = parseInt(el.dataset.cdEnd);
        const rest = Math.max(0, Math.ceil((end - Date.now()) / 1000));
        const min  = Math.floor(rest / 60);
        el.textContent = rest > 0 ? `⏳${min}m` : '';
    });
}, 10000);
</script>

<!-- ── ESTILOS TARJETAS PARTY ─────────────────────────────── -->
<style>
.party-scroll {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 14px;
    margin-bottom: 32px;
}
.party-card-link { display:block; text-decoration:none; color:inherit; }
.party-card {
    background: var(--bg2);
    border: 1px solid var(--gold-border);
    border-radius: var(--rl);
    overflow: hidden;
    transition: border-color 0.2s, transform 0.18s, box-shadow 0.2s;
    cursor: pointer;
}
.party-card:hover {
    border-color: var(--gold);
    transform: translateY(-3px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.party-card-img-wrap {
    position: relative;
    width: 100%; height: 130px;
    overflow: hidden;
    background: var(--bg3);
}
.party-card-img {
    width: 100%; height: 100%;
    object-fit: cover; object-position: top center;
    opacity: 0.7;
    display: block;
    transition: opacity 0.3s, transform 0.3s;
}
.party-card:hover .party-card-img { opacity: 0.9; transform: scale(1.05); }
.party-card-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(7,6,14,0.9) 0%, transparent 60%);
}
.party-card-name {
    position: absolute; bottom: 8px; left: 12px; right: 12px;
    font-family: var(--font-display);
    font-size: 0.85em;
    color: var(--gold);
    letter-spacing: 0.5px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
}
.party-card-body { padding: 12px 14px 14px; }
.party-card-hex {
    font-family: var(--font-display);
    font-size: 1.3em;
    color: var(--gold);
    margin-bottom: 10px;
    line-height: 1;
}
.party-stat-row {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 5px;
}
.party-stat-label {
    width: 48px; font-size: 0.62em;
    color: var(--dim); letter-spacing: 1px;
    text-align: right; flex-shrink: 0;
}
.party-bar-track {
    flex: 1; height: 4px;
    background: var(--bg4); border-radius: 2px; overflow: hidden;
}
.party-bar-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }
.party-bar-vida   { background: var(--gold); }
.party-bar-vex    { background: var(--violet); opacity: 0.85; }
.party-bar-guarda { background: var(--gold); opacity: 0.45; }
.party-stat-val {
    min-width: 58px; text-align: right;
    font-size: 0.72em; color: var(--text);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
}
.party-pushes {
    display: flex; gap: 6px; flex-wrap: wrap;
    margin-top: 8px;
}
.party-push-tag {
    font-size: 0.68em;
    padding: 2px 8px; border-radius: 20px;
    border: 1px solid; display: inline-flex; align-items: center; gap: 3px;
    font-variant-numeric: tabular-nums;
}
.party-push-vex {
    border-color: var(--violet-border);
    color: #a07fd4; background: var(--violet-faint);
}
.party-push-guarda {
    border-color: var(--gold-border);
    color: var(--gold-dim); background: var(--gold-faint);
}
.push-cd-tag { opacity: 0.65; }
.push-cd-mini { font-size: 0.88em; color: #c47070; }
</style>
</body>
</html>
