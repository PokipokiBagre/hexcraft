<!DOCTYPE html>
<html lang="es">
<head>
    <script src="../hex-guard.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Hechizos — HEX ROL</title>
    <link rel="icon" type="image/png" id="dynamic-favicon" href="../img/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="hechizos.css">
    <style>/* estilos inline adicionales */</style>
</head>
<body>

<nav id="hm-nav">
    <div id="hm-nav-left">
        <a id="hm-back" href="../index.html">← Inicio</a>
        <span id="hm-title">✦ Hechizos</span>
    </div>

    <div id="hm-search-bar">
        <input id="hm-search-central" type="text" autocomplete="off" spellcheck="false"
            placeholder="Buscar hechizo… nombre, afinidad o número (ej: 7)"
            oninput="window._hmBuscarCentral(this.value)">
    </div>

    <div id="hm-toolbar">
        <button class="hm-btn gold" id="btn-toggle-op" style="display:none;" onclick="window._hmToggleOpLeft()">⚙ Panel OP</button>

        <button class="hm-btn" onclick="window._hmCentrar()" title="Centrar vista">⊙ Centrar</button>
        <div class="hm-tab-sep"></div>

        <div class="hm-pj-pool-wrap" id="pool-jugadores-wrap">
            <button class="hm-pj-pool-btn" id="pool-jug-btn" onclick="window._hmTogglePool('jugadores')">
                👤 Jugadores <span style="font-size:0.8em;opacity:0.5;">▾</span>
            </button>
            <div class="hm-pj-pool-dropdown" id="pool-jugadores-drop">
                <div class="hm-pool-title">Jugadores</div>
                <div class="hm-pool-grid" id="pool-jug-grid"></div>
                <button class="hm-pool-todos" onclick="window._hmCambiarPJ('Todos');window._hmCerrarPools()">Todos / limpiar filtro</button>
            </div>
        </div>

        <div class="hm-pj-pool-wrap" id="pool-npcs-wrap">
            <button class="hm-pj-pool-btn" id="pool-npc-btn" onclick="window._hmTogglePool('npcs')">
                🤖 NPCs <span style="font-size:0.8em;opacity:0.5;">▾</span>
            </button>
            <div class="hm-pj-pool-dropdown" id="pool-npcs-drop">
                <div class="hm-pool-title">NPCs</div>
                <div class="hm-pool-grid" id="pool-npc-grid"></div>
            </div>
        </div>

        <span id="hm-sel-badge" style="display:none;">0 sel.</span>
    </div>
</nav>

<div id="hm-op-tools">
    </div>

<div id="hm-side-panel">
    <div id="hm-side-panel-header">
        <span class="sp-titulo" id="sp-titulo-txt">Info Hechizo</span>
        <button class="sp-close" onclick="window._hmCerrarSidePanel()">×</button>
    </div>
    <div id="hm-side-panel-body"></div>
</div>

<div id="hm-clipboard">
    <span class="clip-close" onclick="document.getElementById('hm-clipboard').classList.remove('visible')">×</span>
    <div id="hm-clipboard-content"></div>
</div>

<div id="hm-op-left">
    <div id="hm-op-left-header">
        <span id="hm-op-left-title">Opciones y Batch</span>
        <button id="hm-op-left-close" onclick="window._hmToggleOpLeft()">×</button>
    </div>
    <div id="hm-op-left-body"></div>
</div>

<div id="hm-canvas-wrap">
    <canvas id="hm-canvas"></canvas>
</div>

<button id="hm-drawer-tab" onclick="window._hmToggleDrawer()">
    ✦ Grimorio <span class="dt-arrow">▲</span>
</button>

<div id="hm-drawer">
    <div id="hm-drawer-inner">
        <div id="hm-drawer-nav">
            <button class="hm-dtab activo" id="dt-grimorio" onclick="window._hmDrawerTab('grimorio')">📖 Grimorio</button>
            <button class="hm-dtab" id="dt-admin" style="display:none" onclick="window._hmDrawerTab('admin')">⚙ Admin</button>
        </div>
        <div id="hm-drawer-body">
            <div id="hm-pane-grimorio">
                <div id="hm-search-wrap">
                    <input id="hm-search" type="text" placeholder="Buscar hechizo…" oninput="window._hmBuscar(this.value)" autocomplete="off" spellcheck="false">
                </div>
                <div id="hm-grimorio-list"></div>
            </div>
            <div id="hm-pane-admin" class="oculto">
                </div>
        </div>
    </div>
</div>

<div id="hm-info-bar">
    <span id="hm-info-nodo" style="color:#444;">Clic en un hechizo para ver detalles</span>
    <span id="hm-info-stats"></span>
    <span id="hm-zoom-label">100%</span>
</div>

<div id="hm-toast"></div>

<script type="module" src="mapa-main.js"></script>
</body>
</html>
